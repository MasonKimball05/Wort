# Wort's apps. Generate the Xcode project with: xcodegen generate
# WortCore (Package.swift) is the tested logic; `swift test` runs it on its own.
name: Wort
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  WortKit:
    path: .
settings:
  base:
    # My paid Apple Developer team; Xcode signs automatically and creates the
    # iCloud container and App Group on first build.
    DEVELOPMENT_TEAM: F4P3T9JYP2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wort-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/WortApp
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WortKit
        product: WortCore
      - target: WortShare
      - target: WortWidget-iOS
    entitlements:
      path: Resources/Wort-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.masonkimball.wort]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.masonkimball.wort]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Wort
        UILaunchScreen: {}
        # CloudKit wakes the app with a silent push when the other device changes something.
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: com.masonkimball.wort
            CFBundleURLSchemes: [wort]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masonkimball.wort
        PRODUCT_NAME: Wort
        TARGETED_DEVICE_FAMILY: "1"

  # Share a word (or a sentence) from Safari, Books, Notes... It only writes a
  # small file into the App Group's inbox; the app looks the word up next launch.
  WortShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/WortShare
        excludes: ["*.js"]
      - path: Sources/WortShare/ExtractArticle.js
        buildPhase: resources
      - path: Sources/WortApp/AppGroupShared.swift
    dependencies:
      - package: WortKit
        product: WortCore
    entitlements:
      path: Resources/WortShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.masonkimball.wort]
    info:
      path: Resources/Info-Share.plist
      properties:
        CFBundleDisplayName: Wort
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              # A Safari page: ExtractArticle.js pulls out the article's text.
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
            NSExtensionJavaScriptPreprocessingFile: ExtractArticle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masonkimball.wort.share
        PRODUCT_NAME: WortShare
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  Wort-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/WortApp
      - path: Resources/Assets.xcassets
    dependencies:
      - package: WortKit
        product: WortCore
      - target: WortWidget-macOS
    entitlements:
      path: Resources/Wort-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Only for the widget's snapshot; the database stays in Application Support.
        com.apple.security.application-groups: [group.com.masonkimball.wort]
        com.apple.security.network.client: true
        # The save panel for exports.
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.masonkimball.wort]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    info:
      path: Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Wort
        LSApplicationCategoryType: public.app-category.education
        CFBundleURLTypes:
          - CFBundleURLName: com.masonkimball.wort
            CFBundleURLSchemes: [wort]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masonkimball.wort
        PRODUCT_NAME: Wort

  # Cards due and the streak. Reads the snapshot the app writes into the App
  # Group (WidgetBridge); never opens the database.
  WortWidget-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/WortWidget
    dependencies:
      - package: WortKit
        product: WortCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Resources/WortWidget-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.masonkimball.wort]
    info:
      path: Resources/Info-Widget-iOS.plist
      properties:
        CFBundleDisplayName: Wort
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masonkimball.wort.widget
        PRODUCT_NAME: WortWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  WortWidget-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/WortWidget
    dependencies:
      - package: WortKit
        product: WortCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Resources/WortWidget-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.com.masonkimball.wort]
    info:
      path: Resources/Info-Widget-macOS.plist
      properties:
        CFBundleDisplayName: Wort
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masonkimball.wort.widget
        PRODUCT_NAME: WortWidget
        SKIP_INSTALL: YES
